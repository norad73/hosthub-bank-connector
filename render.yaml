# Render Blueprint: BankConnector web service + daily balance sync cron.
# Deploy: render blueprint apply  (after render login)
#
# Cron jobs on Render cannot mount the persistent disk, so the cron service
# only triggers POST /cron/sync-balances on the web service, which reads
# bank consents from /data and pushes rows to Google Sheets.

services:
  - type: web
    name: bankconnector
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      - key: CRON_SECRET
        generateValue: true
      - key: GOOGLE_SHEETS_WEBHOOK_URL
        value: https://script.google.com/macros/s/AKfycbzN80dtSLdENv2DdEGOkR-cJDKqPCBjVJzjkKKUlgacBfTryWNpDml0ShxpgTNHzVtsGg/exec
      - key: VIVA_MERCHANT_ID
        sync: false
      - key: VIVA_API_KEY
        sync: false
      - key: VIVA_ACCOUNT_CLIENT_ID
        sync: false
      - key: VIVA_ACCOUNT_CLIENT_SECRET
        sync: false
      - key: VIVA_DATA_SERVICES_CLIENT_ID
        sync: false
      - key: VIVA_DATA_SERVICES_CLIENT_SECRET
        sync: false
      - key: AIRWALLEX_CLIENT_ID
        sync: false
      - key: AIRWALLEX_API_KEY
        sync: false
      - key: AIRWALLEX_ACCOUNT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: MERCURY_API_TOKEN
        sync: false
      - key: CLEDARA_API_TOKEN
        sync: false
      - key: WISE_API_TOKEN
        sync: false
      - key: WISE_PROFILE_ID
        sync: false
      - key: WISE_ACCOUNT_LABEL
        sync: false
      - key: DEFAULT_COUNTRY
        value: GR
    disk:
      name: bank-data
      mountPath: /data
      sizeGB: 1

  - type: cron
    name: bankconnector-sync-balances
    runtime: docker
    schedule: "0 16 * * *"  # 19:00 Europe/Athens (EEST, UTC+3)
    dockerfilePath: ./Dockerfile.cron
    envVars:
      - key: BANKCONNECTOR_HOST
        fromService:
          type: web
          name: bankconnector
          property: host
      - key: CRON_SECRET
        fromService:
          type: web
          name: bankconnector
          envVarKey: CRON_SECRET
